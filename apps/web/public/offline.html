<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020013" />
    <title>MessMate — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #020013; color: #fff; text-align: center; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #858fad; margin: 0 0 24px; line-height: 1.5; }
      button {
        background: #3291ff; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 24px; font-size: 15px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>MessMate needs an internet connection to load your mess.<br />আপনি অফলাইনে আছেন।</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
